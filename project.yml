# XcodeGen spec: `xcodegen generate` produces BP.xcodeproj from Sources/.
# Team ID and bundle id are NOT set here; scripts/build_ipa.sh passes them on the xcodebuild command line.
name: BP
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MTL_LANGUAGE_REVISION: Metal30
    MTL_FAST_MATH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BP:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bp
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: B.P
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities: [arm64, metal]
        NSPhotoLibraryUsageDescription: B.P imports photos and videos from your library to edit them.
        NSPhotoLibraryAddUsageDescription: B.P saves exported videos to your library.
        NSMicrophoneUsageDescription: B.P records voice-over audio for your projects.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  BP:
    build:
      targets:
        BP: all
    archive:
      config: Release
